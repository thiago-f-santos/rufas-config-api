services:
  db:
    image: postgis/postgis:16-3.4
    container_name: rufas_postgis
    environment:
      POSTGRES_DB: rufas_config
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rufas_config"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
